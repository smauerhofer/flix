Root: ../../flix-data
NameReviewThreshold: 0.82
AddressReviewThreshold: 0.90
# A whitelist never overrides a blacklist hit with these settings. Setting
# WhitelistOverridesAll: true or ListPrecedence: WhitelistFirst lets it do so.
WhitelistOverridesAll: false
ListPrecedence: BlacklistFirst
# Blacklist name/address thresholds. Whitelists always require the exact normalized value.
ListNameThreshold: 0.92
ListAddressThreshold: 0.95

# Local AI reranking (disabled until a compatible ONNX model is supplied).
AI:
  Enabled: false
  ModelPath: ""
  ModelVersion: ""
  MaxCandidatesPerField: 100
  RankingWeight: 0.30
  MinimumConfidence: 0.70
